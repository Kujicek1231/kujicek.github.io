<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI? Pojď si to vyzkoušet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Jednotný vizuál podle mesic.ai: tmavá noční fialová, bílé písmo, fialová záře, perspektivní mřížka */
:root{
  --bg:#110D29; --surface:rgba(22,17,52,.72); --surface-solid:#17123A; --ink:#FFFFFF; --muted:#B3AED0;
  --line:rgba(113,86,244,.55); --line-soft:rgba(255,255,255,.1);
  --accent:#7156F4; --accent-2:#5B43E6; --on-accent:#FFFFFF; --soft:rgba(113,86,244,.16); --hl:#A796FF;
  --font:"Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
/* Stránka je záměrně vždy tmavá, stejně jako mesic.ai */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){color-scheme:dark;} }
:root[data-theme="dark"]{color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
html,body{margin:0;}
html{background:var(--bg);}
body{background:var(--bg); color:var(--ink); font-family:var(--font); font-size:1.1rem; line-height:1.6; min-height:100%; -webkit-font-smoothing:antialiased;}

/* Pozadí */
.bg{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;}
.bg .glow{position:absolute; left:50%; top:-18rem; width:80rem; height:44rem; transform:translateX(-50%); background:radial-gradient(closest-side, rgba(113,86,244,.32), transparent);}
.bg .rain{position:absolute; inset:0 0 45% 0; background:repeating-linear-gradient(90deg, transparent 0 37px, rgba(140,120,255,.13) 37px 38px, transparent 38px 61px, rgba(140,120,255,.07) 61px 62px, transparent 62px 97px); -webkit-mask-image:linear-gradient(180deg, transparent, #000 25%, #000 60%, transparent); mask-image:linear-gradient(180deg, transparent, #000 25%, #000 60%, transparent); opacity:.7;}
.bg .beam{position:absolute; left:0; right:0; top:44%; height:2px; background:linear-gradient(90deg, transparent, rgba(113,86,244,.55) 20%, #B8A9FF 50%, rgba(113,86,244,.55) 80%, transparent); box-shadow:0 0 30px 6px rgba(113,86,244,.45);}
.bg .grid{position:absolute; left:-50%; right:-50%; top:44%; height:120%; transform-origin:top center; transform:perspective(520px) rotateX(62deg); background-image:linear-gradient(rgba(113,86,244,.32) 1px, transparent 1px), linear-gradient(90deg, rgba(113,86,244,.32) 1px, transparent 1px); background-size:110px 110px; -webkit-mask-image:linear-gradient(180deg, #000, transparent 75%); mask-image:linear-gradient(180deg, #000, transparent 75%);}

main{position:relative; z-index:1; max-width:48rem; margin:0 auto; padding:1.25rem 1.25rem 4rem; outline:none;}
h1,h2,h3{font-family:var(--font); color:var(--ink); line-height:1.08; margin:0 0 .7rem; letter-spacing:-.03em;}
h1{font-size:clamp(2.3rem, 7vw, 3.6rem); font-weight:600;}
h2{font-size:clamp(1.45rem, 4vw, 1.95rem); font-weight:600; line-height:1.18; letter-spacing:-.02em;}
h3{font-size:1.2rem; font-weight:600; letter-spacing:-.01em;}
p{margin:0 0 1rem; max-width:62ch;}
strong{font-weight:600;}
[tabindex="-1"]:focus{outline:none;}
button{font:inherit; color:inherit; cursor:pointer;}
button:disabled{cursor:not-allowed; opacity:.4;}
:focus-visible{outline:2px solid #B8A9FF; outline-offset:3px; border-radius:10px;}
.muted{color:var(--muted);}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:.5rem; min-height:3.25rem; padding:.75rem 1.7rem; background:linear-gradient(180deg, #8068FF, var(--accent-2)); color:#fff; border:0; border-radius:999px; font-weight:600; font-size:1.05rem; box-shadow:0 0 28px rgba(113,86,244,.45), inset 0 1px 0 rgba(255,255,255,.2);}
.btn:hover:not(:disabled){filter:brightness(1.12);}
.btn.ghost{background:rgba(17,13,41,.6); box-shadow:inset 0 0 0 1px var(--line);}
.actions{display:flex; flex-wrap:wrap; gap:.6rem; max-width:none;}

.bar{display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; margin-bottom:1.75rem; font-weight:500; color:var(--muted);}
.bar .back{background:none; border:0; padding:.4rem 0; color:var(--ink); font-weight:600;}
.bar .back:hover{color:var(--hl);}
.bar .spacer{flex:1;}
.pill{background:var(--soft); color:var(--ink); padding:.3rem .9rem; border-radius:999px; font-size:.92rem; box-shadow:inset 0 0 0 1px var(--line-soft);}
.linkish{border:0; font-weight:600;}

.bajt{display:block; width:7rem; height:auto; flex:none; filter:drop-shadow(0 0 18px rgba(113,86,244,.55));}
.bajt.small{width:3.4rem;}
.bubble{background:var(--surface); border:1px solid var(--line); padding:.8rem 1rem; border-radius:1rem 1rem 1rem .3rem; margin:0; font-size:1rem; backdrop-filter:blur(6px);}

/* Rozcestí */
.hero{display:flex; flex-direction:column; align-items:center; text-align:center; padding:3.5rem 0 3rem;}
.brand{font-weight:600; font-size:.95rem; color:var(--muted); margin:0 0 1rem;}
.hero h1{font-size:clamp(2.8rem, 10vw, 4.8rem); line-height:1.02;}
.hero p.lead{font-size:1.15rem; color:var(--muted); margin:0 auto 2rem; max-width:32rem;}
.hero-bajt{display:flex; align-items:flex-end; gap:.75rem; text-align:left; max-width:26rem;}
.hero-bajt .bajt{animation:wave 1.4s ease-out .3s 1 both;}
@keyframes wave{0%{transform:translateY(12px) rotate(-6deg); opacity:0} 60%{transform:translateY(-4px) rotate(4deg); opacity:1} 100%{transform:none}}

.doors{display:grid; gap:1rem; margin-bottom:3rem;}
@media (min-width:40rem){.doors{grid-template-columns:repeat(2,1fr);}}
.door{display:flex; flex-direction:column; gap:.4rem; text-align:left; padding:1.4rem; border:1px solid var(--line); border-radius:14px; background:var(--surface); backdrop-filter:blur(6px); color:var(--ink); transition:border-color .15s ease, box-shadow .15s ease;}
.door:hover{border-color:#9C87FF; box-shadow:0 0 30px rgba(113,86,244,.35);}
.door .e{font-size:2rem; line-height:1; margin-bottom:.3rem;}
.door .t{font-size:1.3rem; font-weight:600; line-height:1.2; letter-spacing:-.02em;}
.door .d{font-size:1rem; color:var(--muted); flex:1;}
.door .m{font-size:.9rem; font-weight:600; color:var(--hl);}

.panel, .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:1.35rem 1.45rem; backdrop-filter:blur(6px);}
.panel{margin-bottom:2.5rem;}
.card{margin-bottom:1.25rem;}
.change-row{margin-bottom:1rem;}
.change-row strong{display:block; margin-bottom:.35rem;}
.meter{display:grid; grid-template-columns:5.5rem 1fr 2.5rem; align-items:center; gap:.6rem; font-size:.95rem; margin:.25rem 0; color:var(--muted);}
.meter .track{height:.6rem; background:rgba(255,255,255,.08); border-radius:1rem; overflow:hidden;}
.meter .fill{height:100%; border-radius:1rem; background:rgba(255,255,255,.35);}
.meter .fill.now{background:var(--accent); box-shadow:0 0 12px rgba(113,86,244,.8);}

.shelf h2{display:flex; align-items:baseline; gap:.75rem; flex-wrap:wrap;}
.shelf h2 span{font-size:1rem; color:var(--muted); font-weight:500; letter-spacing:0;}
.badges{list-style:none; padding:0; margin:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(9.5rem,1fr)); gap:.75rem;}
.badges li{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:.95rem; text-align:center; font-size:.9rem; line-height:1.35; color:var(--muted);}
.badges .be{font-size:2rem; display:block; margin-bottom:.3rem;}
.badges .bn{font-weight:600; display:block; margin-bottom:.2rem; color:var(--ink);}
.badges li.locked{border-color:var(--line-soft); opacity:.6;}
.badges li.locked .be{filter:grayscale(1); opacity:.6;}
.reset{margin-top:2.5rem; background:none; border:0; color:var(--muted); text-decoration:underline; font-size:.92rem; padding:.5rem 0;}

/* Měření */
.scale-q{margin-bottom:1.75rem;}
.scale-q h2{font-size:clamp(1.25rem,3.6vw,1.6rem);}
.scale{display:grid; grid-template-columns:repeat(5,1fr); gap:.5rem; margin:.75rem 0 .4rem;}
.scale button{min-height:3.25rem; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:1.25rem;}
.scale button:hover{border-color:#9C87FF;}
.scale button[aria-pressed="true"]{background:var(--accent); border-color:#9C87FF; box-shadow:0 0 20px rgba(113,86,244,.6);}
.scale-ends{display:flex; justify-content:space-between; font-size:.9rem; color:var(--muted);}

/* Úkoly a volby (stejné ve všech hrách) */
.task-name{font-weight:600; color:var(--hl); margin-bottom:.35rem;}
.draft{display:flex; gap:.9rem; align-items:flex-start;}
.draft .who{font-weight:600; margin-bottom:.4rem; font-size:.95rem; color:var(--muted);}
.draft pre{white-space:pre-wrap; font-family:var(--font); margin:0; font-size:1.02rem; background:rgba(0,0,0,.25); border:1px solid var(--line-soft); padding:.9rem 1rem; border-radius:10px;}
.choices{display:grid; gap:.75rem;}
@media (min-width:40rem){.choices.three{grid-template-columns:repeat(3,1fr);}}
.choice{min-height:3.5rem; padding:.95rem 1rem; border-radius:12px; background:var(--surface); border:1px solid var(--line); font-weight:600; text-align:center; backdrop-filter:blur(6px);}
.choice:hover{border-color:#9C87FF; box-shadow:0 0 24px rgba(113,86,244,.35);}
.choice .ce{display:block; font-size:1.5rem; margin-bottom:.15rem;}
.result{animation:pop .35s ease-out both;}
@keyframes pop{from{transform:scale(.97); opacity:0} to{transform:none; opacity:1}}
.points{display:inline-block; font-weight:600; font-size:1.1rem; padding:.2rem .9rem; border-radius:999px; background:var(--accent); color:#fff; margin-bottom:.7rem; box-shadow:0 0 18px rgba(113,86,244,.6);}
.quip{display:flex; gap:.75rem; align-items:flex-end; margin:1rem 0 1.25rem;}
.big-score{font-weight:600; font-size:clamp(3.8rem,15vw,6.5rem); line-height:1; margin:.5rem 0; letter-spacing:-.05em; text-shadow:0 0 40px rgba(113,86,244,.7);}
.steps{display:flex; gap:.4rem; margin-bottom:1.5rem;}
.steps i{flex:1; height:.3rem; border-radius:1rem; background:rgba(255,255,255,.1);}
.steps i.done{background:var(--accent); box-shadow:0 0 10px rgba(113,86,244,.8);}
.streak{color:var(--hl); font-weight:600;}

/* Mýty */
.breath{width:9rem; height:9rem; margin:1rem 0 2rem; border-radius:50%; background:radial-gradient(circle, rgba(113,86,244,.45), rgba(113,86,244,.08) 70%); border:1px solid var(--line); display:grid; place-items:center; color:var(--ink); font-weight:500; animation:breathe 8s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:scale(.82)} 50%{transform:scale(1.05)}}
.statement{font-weight:600; font-size:clamp(1.7rem,5.5vw,2.5rem); line-height:1.2; margin:1rem 0 2rem;}
.compare{display:grid; gap:.5rem; margin-bottom:1rem;}
.compare div{padding:.6rem .9rem; border-radius:10px; background:var(--soft);}

/* Povolání */
.jobs{display:grid; gap:.9rem; grid-template-columns:repeat(auto-fit, minmax(14rem,1fr)); margin:1.25rem 0;}
.job{display:flex; align-items:center; gap:.9rem; text-align:left; padding:1rem 1.1rem; border-radius:12px; background:var(--surface); border:1px solid var(--line-soft); backdrop-filter:blur(6px);}
.job:hover{border-color:#9C87FF;}
.job .je{font-size:2rem;}
.job .jn{font-weight:600; display:block;}
.job .js{font-size:.9rem; color:var(--muted);}
.job.won{border-color:var(--line); box-shadow:0 0 22px rgba(113,86,244,.3);}
.msg-from{font-size:.95rem; margin:-.2rem 0 .7rem;}
.msg{white-space:pre-wrap; font-family:var(--font); margin:0; font-size:1.08rem; background:rgba(0,0,0,.25); border:1px solid var(--line-soft); padding:1rem 1.1rem; border-radius:10px;}
.flags{margin:0 0 1rem; padding-left:1.2rem; display:grid; gap:.35rem;}
.flags li::marker{color:var(--hl);}
.job-hero{font-size:3.6rem; line-height:1; margin:.5rem 0 1rem;}
.lead3{font-size:1.2rem;}
.daybar{display:flex; height:1.2rem; border-radius:.6rem; overflow:hidden; margin:.75rem 0; gap:2px;}
.seg-ai{background:#7156F4;} .seg-spolu{background:#A796FF;} .seg-clovek{background:#FFFFFF;}
.legend{list-style:none; padding:0; margin:0 0 1rem; display:grid; gap:.3rem;}
.legend .dot{display:inline-block; width:.85rem; height:.85rem; border-radius:50%; margin-right:.5rem; vertical-align:-.05rem;}

.toast{position:fixed; left:50%; bottom:0; transform:translate(-50%, 120%); padding:.9rem 1.4rem; padding-bottom:calc(.9rem + env(safe-area-inset-bottom,0px)); background:linear-gradient(180deg, #8068FF, var(--accent-2)); color:#fff; border-radius:14px 14px 0 0; font-weight:600; transition:transform .35s ease; z-index:20; max-width:92vw; text-align:center; box-shadow:0 0 30px rgba(113,86,244,.6);}
.toast.show{transform:translate(-50%,0);}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important; transition:none !important;}}
</style>
</head>
<body data-mod="home">
<div class="bg" aria-hidden="true"><div class="glow"></div><div class="rain"></div><div class="beam"></div><div class="grid"></div></div>
<main id="app" tabindex="-1"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Data ---------- */
const M1 = [
  {name:'E-mail klientovi',
   task:'Klient čeká na zakázku o týden déle. Pošli mu omluvný e-mail.',
   ai:'Dobrý den, pane Nováku,\nomlouváme se za týdenní zpoždění. Zakázku vám doručíme v pátek 6. listopadu a jako omluvu získáte dopravu zdarma.\n\nS pozdravem\nVáš jazykový model',
   score:{use:0, fix:2, self:1},
   fb:{use:'Pan Novák teď ví, že mu píše „Váš jazykový model“. A těší se na dopravu zdarma, o které šéf nic neví. Text byl dobrý, jen chtěl projít.',
       fix:'Přesně tak. Pod e-mailem je tvoje jméno a doprava zdarma, kterou si Bajt vymyslel, zmizela. Hotovo za minutu místo za deset.',
       self:'Taky dobře, jen to trvalo čtvrt hodiny. Bajtův návrh stačilo opravit na dvou místech.'},
   quip:'Podpis „Váš jazykový model“ mi přišel elegantní. Beru zpět.'},
  {name:'Zápis z porady',
   task:'Porada trvala hodinu. Kolegové chtějí shrnutí v pěti bodech.',
   ai:'1. Nový web spustíme 1. prosince.\n2. Za texty odpovídá Petra.\n3. Rozpočet zůstává beze změny.\n4. Příští porada je ve čtvrtek v 10:00.\n5. Kávovar ve 2. patře zase funguje. 🎉',
   score:{use:2, fix:1, self:0},
   fb:{use:'Výborně. Body sedí s tvými poznámkami. Přesně na tohle se AI hodí: na nudné přepisování.',
       fix:'Proč ne, ale shrnutí bylo v pořádku. Včetně kávovaru, který kolegy zajímá možná nejvíc.',
       self:'Hodina přepisování poznámek. Bajt to měl za tři vteřiny a správně.'},
   quip:'Kávovar jsem dal na konec, aby to mělo pointu.'},
  {name:'Přání kolegyni',
   task:'Jana slaví padesátiny. Celé oddělení jí podepisuje přání.',
   ai:'Vážená kolegyně,\nk Vašemu životnímu jubileu Vám přejeme hodně zdraví, štěstí a pracovních úspěchů.',
   score:{use:0, fix:1, self:2},
   fb:{use:'Jana zdvořile poděkuje. Stejně zdvořile, jako by děkovala pojišťovně.',
       fix:'Lepší. Přibyla vzpomínka na firemní výlet, kdy Jana vyvedla celý tým z bouřky. Tohle by Bajt vědět nemohl.',
       self:'Trefa. Přání je o tom, jak Jana každé pondělí nosí bábovku. Tohle napíše jen někdo, kdo ji zná.'},
   quip:'Já Janu neznám. Ani tu bábovku. Škoda.'},
  {name:'Cestovní výdaje',
   task:'Sečti výdaje za služební cestu: vlak 640 Kč, hotel 2 100 Kč, jídlo 485 Kč.',
   ai:'Celkem: 3 525 Kč',
   score:{use:0, fix:2, self:1},
   fb:{use:'Účetní se ozve: přebývá tam 300 Kč. AI se umí splést i v počtech, když to nikdo nezkontroluje.',
       fix:'Správně je 3 225 Kč. Bajt se přepočítal o tři stovky. Kontrola čísel se vyplatí vždycky.',
       self:'Spočítáno správně. Příště může počítat Bajt, ale kontrola zůstává na tobě.'},
   quip:'Tři stovky sem, tři stovky tam… Dobře, máš pravdu.'},
  {name:'Menu pro turisty',
   task:'Restaurace chce jídelní lístek v angličtině.',
   ai:'Svíčková na smetaně → Candle on cream\nŠpekové knedlíky → Bacon dumplings\nUtopenec → Drowned man',
   score:{use:0, fix:2, self:1},
   fb:{use:'Turisté si menu fotí a smějí se. Svíčku na smetaně si nikdo neobjedná.',
       fix:'Ze svíčkové je „Beef sirloin in cream sauce“ a z utopence „Pickled sausage“. Většinu přeložil Bajt, ty hlídáš, aby se nikdo nelekl.',
       self:'Překlad je hotový, ale trval hodinu. Knedlíky přitom Bajt přeložil dobře.'},
   quip:'Svíčková je přece „candle“. To dává smysl! …Nedává?'},
  {name:'Smutný kolega',
   task:'Kolega Tomáš je dnes zaražený. Prý se rozešel s přítelkyní.',
   ai:'Navrhuji poslat Tomášovi tabulku „Výhody a nevýhody single života“ ve formátu .xlsx.',
   score:{use:0, fix:1, self:2},
   fb:{use:'Tomáš otevře tabulku. Pak zavře notebook. Pak jde na oběd sám.',
       fix:'Tabulka je pryč a místo ní zpráva „Nezajdeme na kafe?“ Dobrý tah, jen to Bajt vůbec nemusel řešit.',
       self:'Prostě jdeš za Tomášem a zeptáš se, jestli nechce na oběd. Žádná tabulka. Tohle je práce pro člověka.'},
   quip:'Tabulky mám rád. Tomáš asi ne. Zapisuju si to.'}
];

const M2_LABEL = {mytus:'Mýtus', pravda:'Pravda', slozite:'Je to složitější'};
const M2 = [
  {s:'AI mi brzy vezme práci.', a:'slozite',
   x:'AI zvládá jednotlivé úkoly, ne celou práci člověka. Některé činnosti se opravdu změní nebo zmizí, podobně jako kdysi s příchodem počítačů a internetu. Lidé, kteří si nové nástroje včas osahají, se obvykle přizpůsobí snáz. Proto má smysl si AI v klidu vyzkoušet.'},
  {s:'AI ví všechno a nikdy se nemýlí.', a:'mytus',
   x:'AI umí znít velmi jistě, i když se plete. Důležité věci, jako je zdraví, peníze nebo úřady, si proto vždy ověř z dalšího zdroje nebo u odborníka.'},
  {s:'S AI můžu mluvit obyčejnou češtinou.', a:'pravda',
   x:'Nepotřebuješ žádné příkazy ani programování. Stačí napsat, co potřebuješ, jako bys psal(a) známému. A když se odpověď nelíbí, napiš, co má být jinak.'},
  {s:'Když AI vyzkouším, nic tím nepokazím.', a:'pravda',
   x:'Ptát se a zkoušet je bezpečné. Jediné pravidlo: nepiš do ní hesla, čísla karet ani rodná čísla. Stejně jako bys je nediktoval(a) cizímu člověku.'},
  {s:'AI má vlastní plány jako roboti ve filmech.', a:'mytus',
   x:'Dnešní AI asistenti nemají vlastní přání ani plány, odpovídají na to, na co se jich zeptáš. Bezpečnost AI se přesto bere vážně a vznikají pro ni pravidla, aby se používala rozumně.'},
  {s:'Na AI už jsem moc starý nebo stará.', a:'mytus',
   x:'Kdo umí napsat zprávu nebo e-mail, zvládne i AI. Spousta lidí začíná drobnostmi: recept ze zbytků v lednici, vysvětlení složitého dopisu z úřadu, pomoc s textem přání.'},
  {s:'AI může pomoct i doma, nejen v práci.', a:'pravda',
   x:'Naplánuje výlet, vysvětlí návod k pračce, pomůže s domácím úkolem nebo s dopisem pojišťovně. Je to trpělivý pomocník, který se nezlobí, když se zeptáš potřetí.'},
  {s:'AI nahradí lidský kontakt.', a:'mytus',
   x:'AI umí odpovídat, ale nezná tvou babičku, nebyla na vaší svatbě a nepřinese ti polévku, když budeš nemocný nebo nemocná. Může ušetřit čas, a ten se dá věnovat právě lidem.'}

/* ---------- Uložený postup ---------- */
const KEY = 'ai-hra-postup-v1';
function blank(){return {badges:[], m1:0, m2:0, m4:0, jobs:{}, pre:null, post:null, preSkipped:false};}
let save = blank();
try{ const raw = localStorage.getItem(KEY); if(raw){ save = Object.assign(blank(), JSON.parse(raw)); } }catch(e){}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(save)); }catch(e){} }
function has(id){return save.badges.includes(id);}
function award(id){
  if(has(id)) return;
  save.badges.push(id); persist();
  const b = BADGES.find(x=>x.id===id);
  toast(`${b.e} Nový odznak: ${b.n}`);
}
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 3200);
}

    </div>
    <div class="quip">${bajt(won?'proud':'happy','small')}<p class="bubble">Všiml jsem si, že mně dáváš hlavně rutinu. A lidem to, na čem záleží. Fér.</p></div>
    <p class="actions"><button class="btn" data-act="m3-job" data-k="${job.id}">Hrát znovu</button> ${postBtn()} <button class="btn ghost" data-act="m3">Jiné povolání</button></p>`);
  const queue = [];
  if(won) queue.push(job.id);
  if(s===MAX3) queue.push('perfekt');
  const jobBadges = JOBS.filter(j=>has(j.id) || queue.includes(j.id)).length;
  if(jobBadges>=5) queue.push('polovina');
  if(jobBadges===JOBS.length) queue.push('velmistr');
  queue.filter(id=>!has(id)).forEach((id,k)=>setTimeout(()=>award(id), k*1300));
}

/* Modul 4: Poznej podvod */
const M4_LABEL = {podvod:'Podvod', overit:'Ověřím si to', ok:'V pořádku'};
const M4_ICON = {podvod:'🚩', overit:'🔍', ok:'✅'};
const M4_HEAD = {'Podvod':'Tohle byl podvod.', 'V pořádku':'Tohle je v pořádku.', 'Ověřit':'Tohle bez ověření nepoznáš.'};
const M4 = [
  {kind:'📞 Telefonát', from:'Neznámé číslo, 22:40',
   text:'„Babi, to jsem já, Kuba. Boural jsem a policie chce kauci 50 000. Prosím, neříkej to mámě. Pošlu pro peníze kamaráda, dáš mu je v hotovosti?“',
   verdict:'Podvod', score:{podvod:2, overit:2, ok:0},
   flags:['Neznámé číslo a pozdní hodina','Spěch a prosba, ať to nikomu neříkáš','Hotovost předávaná cizímu člověku'],
   x:'S pomocí AI se dá napodobit hlas z pár vteřin nahrávky ze sociálních sítí. Zavěs a zavolej Kubovi nebo jeho rodičům na číslo, které znáš. Policie kauci po telefonu ani přes poslíčky nevybírá.'},
  {kind:'💬 SMS', from:'Odesílatel: DORUCENI-INFO',
   text:'Vaše zásilka čeká na doplacení cla 39 Kč. Bez platby bude do 24 hodin vrácena odesílateli: zasilka-clo.top/platba',
   verdict:'Podvod', score:{podvod:2, overit:1, ok:0},
   flags:['Malá částka, která má ukolébat','Odkaz na podivnou adresu','Hrozba a časový limit'],
   x:'Podvodníkům nejde o 39 Kč, chtějí údaje z tvé platební karty. Stav zásilky si zkontroluj v aplikaci nebo na webu dopravce, který si otevřeš sám nebo sama. Na odkaz v SMS neklikej.'},
  {kind:'🎬 Video na sociální síti', from:'Sponzorovaný příspěvek',
   text:'Známý televizní moderátor v rozhovoru říká: „Díky této platformě vydělávám 30 % měsíčně. Stačí vložit 5 000 Kč. Počet míst je omezený.“',
   verdict:'Podvod', score:{podvod:2, overit:1, ok:0},
   flags:['Zaručený vysoký výnos','Známá tvář v reklamě na investice','Omezený počet míst, tedy tlak na rychlost'],
   x:'Video se slavnou tváří dnes AI vyrobí tak, že vypadá věrohodně. Žádná poctivá investice nezaručuje 30 % měsíčně. Slavní lidé o takových reklamách většinou vůbec nevědí.'},
  {kind:'📧 E-mail', from:'Jan Svoboda, ředitel (jan.svoboda@firma-mail.net)',
   text:'„Jsem na jednání a nemůžu volat. Potřebuju, abyste dnes do 14:00 zaplatila zálohu novému dodavateli, 380 000 Kč. Číslo účtu je v příloze. Zatím to nikomu neříkejte, je to důvěrné.“',
   verdict:'Podvod', score:{podvod:2, overit:2, ok:0},
   flags:['Adresa vypadá podobně, ale není firemní','Nový účet a velká částka','Spěch a důvěrnost'],
   x:'Podvodníci se vydávají za vedení firmy a AI jim pomůže napsat e-mail přesně stylem šéfa, někdy i napodobit jeho hlas. Neobvyklou platbu vždy ověř jinou cestou, třeba telefonátem na číslo, které znáš.'},
  {kind:'💬 SMS', from:'Lékárna U Zlaté váhy',
   text:'Váš recept je připraven k vyzvednutí. Otevřeno dnes do 18:00. Lékárna U Zlaté váhy, Husova 12.',
   verdict:'V pořádku', score:{ok:2, overit:1, podvod:0},
   flags:['Nechce peníze ani žádné údaje','Neobsahuje odkaz','Sedí na tvou situaci: recept ti lékař opravdu vystavil'],
   x:'Ne každá zpráva je podvod. Když zpráva nic nežádá a odpovídá tomu, co čekáš, je v pořádku. Ostražitost se vyplatí, panika ne.'},
  {kind:'📞 Telefonát', from:'Číslo, které vypadá jako číslo tvé banky',
   text:'„Dobrý den, tady bezpečnostní oddělení vaší banky. Z vašeho účtu odchází podezřelá platba. Abychom ji zastavili, nadiktujte mi prosím kód, který vám právě přišel v SMS.“',
   verdict:'Podvod', score:{podvod:2, overit:2, ok:0},
   flags:['Žádost o kód z SMS','Strach o peníze, který tě má rozhodit','Číslo volajícího se dá snadno zfalšovat'],
   x:'Banka po tobě nikdy nebude chtít kód z SMS, PIN ani heslo. Zavěs a zavolej na číslo, které máš na kartě nebo v aplikaci banky.'},
  {kind:'🖼️ Fotka na sociální síti', from:'Sdílel ji známý ze školy',
   text:'Dramatická fotka zaplaveného Karlova mostu s popiskem „Praha je pod vodou a média to tají! SDÍLEJTE!“',
   verdict:'Ověřit', score:{overit:2, podvod:1, ok:0},
   flags:['Zpravodajské weby o tom nepíšou','Výzva ke sdílení a tvrzení, že to někdo tají','Obrázek je až podezřele dokonalý'],
   x:'AI dnes vytvoří realistickou fotku čehokoli. Než něco sdílíš, podívej se, jestli o tom píšou seriózní zpravodajské weby. Když o povodni v Praze nikdo nepíše, nejspíš žádná není.'},
  {kind:'📧 E-mail', from:'E-shop, kde jsi včera nakupoval(a)',
   text:'Děkujeme za objednávku č. 2026-48151. Zboží odešleme zítra. Stav objednávky najdete ve svém účtu na našem webu.',
   verdict:'V pořádku', score:{ok:2, overit:1, podvod:0},
   flags:['Odpovídá nákupu, který jsi opravdu udělal(a)','Nechce platbu ani přihlášení přes odkaz','Posílá tě do účtu, který si otevřeš sám nebo sama'],
   x:'Potvrzení objednávky je běžná zpráva. Kdyby tě ale e-mail tlačil k další platbě nebo k přihlášení přes odkaz, jdi raději na web e-shopu sám nebo sama.'}
];
const MAX4 = M4.length*2, WIN4 = 13;
let m4 = {i:0, score:0, picked:null};
function m4Intro(){
  m4 = {i:0, score:0, picked:null};
  show('m4', `${bar()}
    <div class="quip">${bajt('happy')}<p class="bubble">AI se dá zneužít i k podvodům. Pomůžu ti poznat, jak to vypadá.</p></div>
    <h1>Poznej podvod</h1>
    <p>Osm zpráv, telefonátů a videí, jaké dnes lidem chodí. Některé jsou podvod vytvořený s pomocí AI, jiné jsou úplně v pořádku. U každé se rozhodni, co uděláš.</p>
    <p class="muted">Správné rozhodnutí 2 body, napůl správné 1 bod. Za ${WIN4} bodů z ${MAX4} získáš odznak Detektiv.</p>
    <button class="btn" data-act="m4-start">Začít</button>`);
}
function m4Step(){
  const q = M4[m4.i];
  const p = m4.picked;
  const steps = M4.map((_,k)=>`<i class="${k<m4.i || (k===m4.i && p)?'done':''}"></i>`).join('');
  let bottom;
  if(!p){
    bottom = `<div class="choices three" role="group" aria-label="Co uděláš?">
      ${['podvod','overit','ok'].map(k=>`<button class="choice" data-act="m4-pick" data-k="${k}"><span class="ce" aria-hidden="true">${M4_ICON[k]}</span>${M4_LABEL[k]}</button>`).join('')}
    </div>`;
  } else {
    const pts = q.score[p];
    const last = m4.i === M4.length-1;
    bottom = `<div class="card result">
      <span class="points">+${pts} ${pts===1?'bod':'body'}</span>
      <h3>${M4_HEAD[q.verdict]}</h3>
      <p><strong>Čeho si všimnout:</strong></p>
      <ul class="flags">${q.flags.map(f=>`<li>${f}</li>`).join('')}</ul>
      <p>${q.x}</p>
      <button class="btn" data-act="m4-next">${last?'Zobrazit výsledek':'Další zpráva'}</button>
    </div>`;
  }
  show('m4', `${bar(`<span class="pill">${m4.i+1} z ${M4.length}</span><span class="pill">Body: ${m4.score}</span>`)}
    <div class="steps" aria-hidden="true">${steps}</div>
    <div class="card">
      <p class="task-name">${q.kind}</p>
      <p class="muted msg-from">${q.from}</p>
      <pre class="msg">${q.text}</pre>
    </div>
    ${bottom}`);
}
function m4End(){
  const s = m4.score;
  save.m4 = Math.max(save.m4||0, s); persist();
  const title = s>=WIN4 ? 'Podvodníci u tebe nepochodí' : s>=9 ? 'Dobrý instinkt' : 'Ještě jedno kolo neuškodí';
  show('m4', `${bar()}
    <h1>Hotovo</h1>
    <p class="big-score">${s} / ${MAX4}</p>
    <h2>${title}</h2>
    <div class="card">
      <h3>Pět pravidel do kapsy</h3>
      <ul class="flags">
        <li>Spěch a tajnost jsou varování. Kdo tlačí na „hned“ a „nikomu to neříkej“, nechce, abys přemýšlel(a).</li>
        <li>Zavěs a zavolej zpátky na číslo, které znáš.</li>
        <li>Domluvte si v rodině heslo pro nouzové situace. Napodobený hlas ho nezná.</li>
        <li>Kódy z SMS, PIN a hesla nikomu nediktuj, ani někomu, kdo tvrdí, že volá z banky.</li>
        <li>Zázračné výnosy se slavnou tváří v reklamě jsou téměř vždy podvod.</li>
      </ul>
      <p style="margin:0">Když už se to stane, hned volej své bance a obrať se na policii na čísle 158. Stydět se není za co, podvody dnes vypadají velmi přesvědčivě.</p>
    </div>
    <div class="quip">${bajt('proud','small')}<p class="bubble">Mimochodem, i mně ověřuj, co tvrdím. Platí to pro všechny AI.</p></div>
    <p class="actions"><button class="btn" data-act="m4">Zahrát znovu</button> ${postBtn()} <button class="btn ghost" data-act="home">Na rozcestí</button></p>`);
  award('ostrazity');
  if(s>=WIN4) setTimeout(()=>award('detektiv'), 1200);
}

/* Měření před a po */
const MQ = [
  {id:'strach', q:'Jak moc se obáváš, že AI připraví lidi jako ty o práci?', lo:'Vůbec', hi:'Velmi'},
  {id:'chut', q:'Jak moc si troufáš AI sám nebo sama vyzkoušet?', lo:'Vůbec', hi:'Určitě'},
  {id:'jistota', q:'Jak moc si věříš, že poznáš podvod vytvořený pomocí AI?', lo:'Vůbec', hi:'Určitě'}
];
let ms = {phase:'pre', next:null, a:{}};
function needPre(){ return !save.pre && !save.preSkipped; }
function openModule(m){ ({m1:m1Intro, m2:m2Intro, m3:m3Menu, m4:m4Intro})[m](); }
function measure(phase, next){
  ms = {phase, next, a:{}};
  const pre = phase==='pre';
  show('home', `${pre?'':bar()}
    <h1>${pre?'Dvě rychlé otázky na začátek':'Jak to vidíš teď?'}</h1>
    <p>${pre?'Na konci zjistíš, jestli se něco změnilo. Odpovědi zůstávají jen v tomto prohlížeči.':'Stejné otázky jako na začátku. Odpověz podle toho, jak to cítíš právě teď.'}</p>
    ${MQ.map(q=>`<div class="scale-q" role="group" aria-labelledby="q-${q.id}">
      <h2 id="q-${q.id}">${q.q}</h2>
      <div class="scale">${[1,2,3,4,5].map(v=>`<button aria-pressed="false" data-act="ms-pick" data-q="${q.id}" data-v="${v}" aria-label="${v} z 5">${v}</button>`).join('')}</div>
      <div class="scale-ends"><span>1 = ${q.lo}</span><span>5 = ${q.hi}</span></div>
    </div>`).join('')}
    <p class="actions"><button class="btn" id="ms-go" data-act="ms-go" disabled>${pre?'Uložit a začít hrát':'Uložit a ukázat změnu'}</button>
    ${pre?'<button class="btn ghost" data-act="ms-skip">Přeskočit</button>':''}</p>`);
}
function msPick(btn){
  const q = btn.dataset.q;
  ms.a[q] = +btn.dataset.v;
  btn.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b===btn?'true':'false'));
  document.getElementById('ms-go').disabled = !MQ.every(x=>ms.a[x.id]);
}
function meterRow(label, before, now){
  return `<div class="change-row"><strong>${label}</strong>
    ${before?`<div class="meter"><span>Na začátku</span><span class="track"><span class="fill" style="display:block;width:${before*20}%"></span></span><span>${before}/5</span></div>`:''}
    <div class="meter"><span>Teď</span><span class="track"><span class="fill now" style="display:block;width:${now*20}%"></span></span><span>${now}/5</span></div></div>`;
}
function changeMessage(){
  const p = save.pre, n = save.post;
  if(!p) return 'Díky za odpovědi. Příště je zkus vyplnit i na začátku, ať je vidět rozdíl.';
  const ds = n.strach - p.strach, dc = n.chut - p.chut;
  if(ds<0 && dc>0) return 'Obava se zmenšila a chuť AI vyzkoušet vzrostla. Přesně o to v téhle hře jde.';
  if(ds<0) return 'Obava se zmenšila. To je dobrý začátek.';
  if(dc>0) return 'Chuť AI vyzkoušet vzrostla. Nejlepší další krok je zeptat se AI dnes na jednu obyčejnou věc.';
  if(ds>0) return 'Obava vzrostla. Možná hra otevřela otázky, které dřív nebyly vidět. Je fér o nich mluvit a ověřovat si informace z více zdrojů.';
  return 'Zůstává to stejné, a to je v pořádku. Někdy pomůže až první vlastní zkušenost s AI.';
}
function showChange(){
  show('home', `${bar()}
    <h1>Tvoje změna</h1>
    <div class="panel">
      ${meterRow('Obava z dopadu AI na práci', save.pre&&save.pre.strach, save.post.strach)}
      ${meterRow('Chuť AI vyzkoušet', save.pre&&save.pre.chut, save.post.chut)}
      ${save.post.jistota ? meterRow('Jistota, že poznáš podvod', save.pre&&save.pre.jistota, save.post.jistota) : ''}
      <p style="margin:0">${changeMessage()}</p>
    </div>
    <p class="actions"><button class="btn" data-act="home">Na rozcestí</button></p>`);
}
function postBtn(){ return `<button class="btn ghost" data-act="ms-post">Jak to vidím teď?</button>`; }

/* ---------- Ovládání ---------- */
app.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const a = b.dataset.act, k = b.dataset.k;
  switch(a){
    case 'home': home(); break;
    case 'reset':
      if(confirm('Opravdu smazat všechny odznaky a rekordy?')){ save = blank(); persist(); home(); }
      break;
    case 'm1': case 'm2': case 'm3': case 'm4':
      if(needPre() && b.closest('.doors')) measure('pre', a); else openModule(a);
      break;
    case 'ms-pick': msPick(b); break;
    case 'm4-start': m4Step(); break;
    case 'm4-pick': m4.picked = k; m4.score += M4[m4.i].score[k]; m4Step(); break;
    case 'm4-next':
      if(m4.i < M4.length-1){ m4.i++; m4.picked=null; m4Step(); } else m4End();
      break;
    case 'ms-skip': save.preSkipped = true; persist(); openModule(ms.next); break;
    case 'ms-go':
      if(ms.phase==='pre'){ save.pre = {...ms.a}; persist(); openModule(ms.next); }
      else { save.post = {...ms.a}; persist(); showChange(); }
      break;
    case 'ms-post': measure('post'); break;
    case 'm1-start': m1Task(); break;
    case 'm1-pick': m1.picked = k; m1.score += M1[m1.i].score[k]; m1Task(); break;
    case 'm1-next':
      if(m1.i < M1.length-1){ m1.i++; m1.picked=null; m1Task(); } else m1End();
      break;
    case 'm2-start': m2Step(); break;
    case 'm2-pick': m2.picked = k; if(k===M2[m2.i].a) m2.match++; m2Step(); break;
    case 'm2-next':
      if(m2.i < M2.length-1){ m2.i++; m2.picked=null; m2Step(); } else m2End();
      break;
    case 'm3-job': m3 = {job:k, i:0, score:0, streak:0, picked:null}; m3Intro(); break;
    case 'm3-start': m3Task(); break;
    case 'm3-pick': {
      const t = JOBS.find(j=>j.id===m3.job).tasks[m3.i];
      const d = Math.abs(ORDER.indexOf(k)-ORDER.indexOf(t.a));
      m3.score += d===0?3:d===1?1:0;
      m3.streak = d===0 ? m3.streak+1 : 0;
      m3.picked = k; m3Task(); break;
    }
    case 'm3-next':
      if(m3.i < JOBS.find(j=>j.id===m3.job).tasks.length-1){ m3.i++; m3.picked=null; m3Task(); } else m3End();
      break;
  }
});

home();
</script>
